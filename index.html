<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Sumanthsrianand</title>
  <!-- Bootstrap CSS for responsive design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 56px;
    }
    .hero {
      background: #f8f9fa;
      padding: 60px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Responsive Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Sumanthsrianand</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1 class="display-4">Welcome to My Portfolio!</h1>
      <p class="lead">Explore my projects and get to know me.</p>
      <button class="btn btn-primary" onclick="showMessage()">Click Me!</button>
      <div id="dynamic-message" class="mt-3"></div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about" class="container py-5">
    <h2>About Me</h2>
    <p>Hi, I'm Sumanthsrianand. I love building things and sharing my work!</p>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="container py-5">
    <h2>Projects</h2>
    <div class="row">
      <div class="col-md-4">
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Project One</h5>
            <p class="card-text">Description of project one.</p>
          </div>
        </div>
      </div>
      <!-- Add more projects as needed -->
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="container py-5">
    <h2>Contact</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="name">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-success">Send</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    &copy; 2025 Sumanthsrianand
  </footer>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showMessage() {
      document.getElementById('dynamic-message').innerHTML = '<div class="alert alert-info">Hello, visitor! Thanks for clicking.</div>';
    }
  </script>
</body>
</html>
